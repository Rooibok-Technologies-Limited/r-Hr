services:

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: rooibok_app
    restart: unless-stopped
    # The entrypoint starts as root (to chown the named volumes), applies
    # migrations + first-boot seed, then runs php-fpm whose workers drop to the
    # remapped www-data (uid 1000 = host bind-mount owner) so writable/ is writable.
    volumes:
      - .:/var/www/html
      - uploads_data:/var/www/html/public/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - rooibok_net
    environment:
      APP_ENV:     ${APP_ENV:-production}
      RUN_INIT:    "1"          # this replica owns migrate + app:init on boot
      DB_HOST:     postgres
      DB_PORT:     5432
      DB_NAME:     ${DB_NAME:-rooibok_hr}
      DB_USER:     ${DB_USER:-rooibok_user}
      DB_PASS:     ${DB_PASS:-rooibok_local_pw}
      REDIS_HOST:  redis
      BEANSTALK:   beanstalkd

  nginx:
    image: nginx:1.25-alpine
    container_name: rooibok_nginx
    restart: unless-stopped
    ports:
      - "12000:80"
      - "443:443"
    volumes:
      - .:/var/www/html:ro
      - uploads_data:/var/www/html/public/uploads:ro
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_data:/etc/letsencrypt
    depends_on:
      - app
    networks:
      - rooibok_net

  postgres:
    image: postgres:16-alpine
    container_name: rooibok_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${DB_NAME:-rooibok_hr}
      POSTGRES_USER:     ${DB_USER:-rooibok_user}
      POSTGRES_PASSWORD: ${DB_PASS:-rooibok_local_pw}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-rooibok_user} -d ${DB_NAME:-rooibok_hr}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - rooibok_net

  postgres_archive:
    image: postgres:16-alpine
    container_name: rooibok_archive
    restart: unless-stopped
    environment:
      POSTGRES_DB:       rooibok_archive
      POSTGRES_USER:     ${DB_USER:-rooibok_user}
      POSTGRES_PASSWORD: ${DB_PASS:-rooibok_local_pw}
    volumes:
      - pg_archive_data:/var/lib/postgresql/data
      - ./docker/postgres/archive_schema.sql:/docker-entrypoint-initdb.d/01_archive_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-rooibok_user} -d rooibok_archive"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - rooibok_net

  redis:
    image: redis:7-alpine
    container_name: rooibok_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - rooibok_net

  beanstalkd:
    image: schickling/beanstalkd
    container_name: rooibok_queue
    restart: unless-stopped
    networks:
      - rooibok_net

  # Background job processor (in-app + email + SMS fan-out over beanstalkd). Shares
  # the app image; RUN_INIT is unset so it never races migrations — it just waits
  # for the DB then consumes the queue.
  queue-worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: rooibok_worker
    restart: unless-stopped
    command: ["php", "/var/www/html/spark", "queue:worker"]
    volumes:
      - .:/var/www/html
      - uploads_data:/var/www/html/public/uploads
    depends_on:
      postgres:
        condition: service_healthy
      beanstalkd:
        condition: service_started
      app:
        condition: service_started
    networks:
      - rooibok_net
    environment:
      APP_ENV:     ${APP_ENV:-production}
      DB_HOST:     postgres
      DB_PORT:     5432
      DB_NAME:     ${DB_NAME:-rooibok_hr}
      DB_USER:     ${DB_USER:-rooibok_user}
      DB_PASS:     ${DB_PASS:-rooibok_local_pw}
      REDIS_HOST:  redis
      BEANSTALK:   beanstalkd

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: rooibok_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL:    ${PGADMIN_EMAIL:-admin@rooibok.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASS:-admin}
    ports:
      - "12020:80"
    depends_on:
      - postgres
    networks:
      - rooibok_net
    profiles:
      - dev

  mailhog:
    image: mailhog/mailhog
    container_name: rooibok_mail
    restart: unless-stopped
    ports:
      - "8026:8025"
    networks:
      - rooibok_net
    profiles:
      - dev

volumes:
  pg_data:
  pg_archive_data:
  redis_data:
  uploads_data:
  certbot_data:

networks:
  rooibok_net:
    driver: bridge
