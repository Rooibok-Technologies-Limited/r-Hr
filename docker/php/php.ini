upload_max_filesize = 20M
post_max_size = 20M
max_execution_time = 120
memory_limit = 256M
display_errors = Off
log_errors = On
date.timezone = Africa/Kampala

; Output buffering — required for the FPM/web SAPI. Without it the compiled
; CLI defaults (output_buffering=0, implicit_flush=On) leak the first byte of
; the view before CodeIgniter sends its response headers/cookies, tripping
; "headers already sent" and a blank HTTP 500.
output_buffering = 4096
implicit_flush = Off

; Security hardening
expose_php = Off
session.cookie_httponly = 1
session.cookie_secure = 0
session.use_strict_mode = 1
session.cookie_samesite = Lax
allow_url_include = Off
