#
# Rooibok HR (r-hr) — ADR-003 Phase 3 production overlay for the shared-Traefik
# VPS (195.110.59.36). Apply with:
#   docker compose -f compose.yml -f docker-compose.prod.yml up -d
#
# Model: ONE CI4 monolith behind ONE shared Traefik edge. The `nginx` service is
# the single backend for EVERY host — landing, admin., api., every tenant
# subdomain {slug}.${PLATFORM_HOST}, and verified custom domains. Traefik
# terminates TLS and routes by Host to nginx:80 over the external `web` network.
# No project host ports are published in prod (Traefik owns :80/:443).
#
# Domain: the Rooibok HR product domain is env-driven — set PLATFORM_HOST in the
# prod .env (the product domain is not yet purchased; do NOT assume the parent
# brand's rooibok.tech). Compose interpolates ${PLATFORM_HOST} into the Host
# rules below, so the domain lives in ONE place.
#
# TLS: a single DNS-01 wildcard cert (resolver `le-dns`, Hostinger provider)
# covers ${PLATFORM_HOST} + *.${PLATFORM_HOST}. Custom domains get per-domain
# HTTP-01 certs (resolver `le`). BOTH resolvers must exist in the shared Traefik
# static config — see DEPLOY-phase3.md.

services:

  # ── nginx: the single web backend, routed by Traefik ──────────────────────
  nginx:
    restart: always
    mem_limit: 128m
    ports: !reset []          # Traefik owns :80/:443 — never publish in prod
    networks:
      - rooibok_net           # reach app:9000 (fastcgi) + db/redis
      - web                   # reachable by the shared Traefik edge
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.services.rhr.loadbalancer.server.port=80"

      # ── Shared HTTP→HTTPS redirect middleware (defined once) ──
      - "traefik.http.middlewares.rhr-redirect-https.redirectscheme.scheme=https"
      - "traefik.http.middlewares.rhr-redirect-https.redirectscheme.permanent=true"
      # ── Admin Basic-Auth gate (hash from .env; see runbook) ──
      - "traefik.http.middlewares.rhr-admin-auth.basicauth.users=${ADMIN_BASICAUTH_USERS}"

      # ── Landing: apex + www. Declares the DNS-01 wildcard cert (apex + *.) ──
      - "traefik.http.routers.rhr-landing.rule=Host(`${PLATFORM_HOST}`) || Host(`www.${PLATFORM_HOST}`)"
      - "traefik.http.routers.rhr-landing.entrypoints=websecure"
      - "traefik.http.routers.rhr-landing.priority=100"
      - "traefik.http.routers.rhr-landing.tls=true"
      - "traefik.http.routers.rhr-landing.tls.certresolver=le-dns"
      - "traefik.http.routers.rhr-landing.tls.domains[0].main=${PLATFORM_HOST}"
      - "traefik.http.routers.rhr-landing.tls.domains[0].sans=*.${PLATFORM_HOST}"
      - "traefik.http.routers.rhr-landing.service=rhr"
      - "traefik.http.routers.rhr-landing-http.rule=Host(`${PLATFORM_HOST}`) || Host(`www.${PLATFORM_HOST}`)"
      - "traefik.http.routers.rhr-landing-http.entrypoints=web"
      - "traefik.http.routers.rhr-landing-http.priority=100"
      - "traefik.http.routers.rhr-landing-http.middlewares=rhr-redirect-https"

      # ── Super-admin: admin.${PLATFORM_HOST} (Basic-Auth + app SuperAuth) ──
      - "traefik.http.routers.rhr-admin.rule=Host(`admin.${PLATFORM_HOST}`)"
      - "traefik.http.routers.rhr-admin.entrypoints=websecure"
      - "traefik.http.routers.rhr-admin.priority=100"
      - "traefik.http.routers.rhr-admin.tls=true"
      - "traefik.http.routers.rhr-admin.tls.certresolver=le-dns"
      - "traefik.http.routers.rhr-admin.middlewares=rhr-admin-auth"
      - "traefik.http.routers.rhr-admin.service=rhr"
      - "traefik.http.routers.rhr-admin-http.rule=Host(`admin.${PLATFORM_HOST}`)"
      - "traefik.http.routers.rhr-admin-http.entrypoints=web"
      - "traefik.http.routers.rhr-admin-http.priority=100"
      - "traefik.http.routers.rhr-admin-http.middlewares=rhr-redirect-https"

      # ── API: api.${PLATFORM_HOST} (app JwtAuth) ──
      - "traefik.http.routers.rhr-api.rule=Host(`api.${PLATFORM_HOST}`)"
      - "traefik.http.routers.rhr-api.entrypoints=websecure"
      - "traefik.http.routers.rhr-api.priority=100"
      - "traefik.http.routers.rhr-api.tls=true"
      - "traefik.http.routers.rhr-api.tls.certresolver=le-dns"
      - "traefik.http.routers.rhr-api.service=rhr"
      - "traefik.http.routers.rhr-api-http.rule=Host(`api.${PLATFORM_HOST}`)"
      - "traefik.http.routers.rhr-api-http.entrypoints=web"
      - "traefik.http.routers.rhr-api-http.priority=100"
      - "traefik.http.routers.rhr-api-http.middlewares=rhr-redirect-https"

      # ── Tenants: every other {slug}.${PLATFORM_HOST} (wildcard cert, low
      #    priority so admin/api/www match their specific routers first) ──
      - "traefik.http.routers.rhr-tenants.rule=HostRegexp(`{sub:[a-z0-9-]+}.${PLATFORM_HOST}`)"
      - "traefik.http.routers.rhr-tenants.entrypoints=websecure"
      - "traefik.http.routers.rhr-tenants.priority=10"
      - "traefik.http.routers.rhr-tenants.tls=true"
      - "traefik.http.routers.rhr-tenants.tls.certresolver=le-dns"
      - "traefik.http.routers.rhr-tenants.service=rhr"
      - "traefik.http.routers.rhr-tenants-http.rule=HostRegexp(`{sub:[a-z0-9-]+}.${PLATFORM_HOST}`)"
      - "traefik.http.routers.rhr-tenants-http.entrypoints=web"
      - "traefik.http.routers.rhr-tenants-http.priority=10"
      - "traefik.http.routers.rhr-tenants-http.middlewares=rhr-redirect-https"

      # ── Custom domains (per-verified-domain, HTTP-01). Copy per domain, or move
      #    to a dynamic file provider once the verification flow lands. Template:
      # - "traefik.http.routers.cd-acme.rule=Host(`hr.acme.com`)"
      # - "traefik.http.routers.cd-acme.entrypoints=websecure"
      # - "traefik.http.routers.cd-acme.priority=100"
      # - "traefik.http.routers.cd-acme.tls=true"
      # - "traefik.http.routers.cd-acme.tls.certresolver=le"
      # - "traefik.http.routers.cd-acme.service=rhr"
      # - "traefik.http.routers.cd-acme-http.rule=Host(`hr.acme.com`)"
      # - "traefik.http.routers.cd-acme-http.entrypoints=web"
      # - "traefik.http.routers.cd-acme-http.middlewares=rhr-redirect-https"

  # ── Backend services: caps + always-restart; stay internal (no web, no labels) ─
  app:
    restart: always
    mem_limit: 512m

  postgres:
    restart: always
    mem_limit: 512m

  postgres_archive:
    restart: always
    mem_limit: 256m

  redis:
    restart: always
    mem_limit: 128m

  beanstalkd:
    restart: always
    mem_limit: 64m

  # Dev-only conveniences — never start in prod (prod mail = Brevo SMTP). The
  # `dev` profile means `docker compose ... up -d` skips them unless --profile dev.
  pgadmin:
    profiles: ["dev"]
    ports: !reset []

  mailhog:
    profiles: ["dev"]
    ports: !reset []

# The shared Traefik edge network (created once on the VPS, owned by Traefik).
networks:
  web:
    external: true
